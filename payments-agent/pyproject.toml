[project]
name = "payagent"
version = "0.1.0"
description = "Executes a payments agent's tool calls against a ledger, with guardrails"
readme = "README.md"
authors = [
    { email = "1910084+beccawong@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
payagent = "payagent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
